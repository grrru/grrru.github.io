baseURL = "https://grrru.github.io/"
title = "grrru.log"
timeZone = "Asia/Seoul"
enableRobotsTXT = true
hasCJKLanguage = true
summaryLength = 28

defaultContentLanguage = "ko"
defaultContentLanguageInSubdir = false
disableLanguages = ["en"]

[module]
  [[module.imports]]
    path = "github.com/geekifan/hugo-theme-chirpy"

[pagination]
  pagerSize = 10

[permalinks.page]
  blog = "/posts/:slug/"
  post = "/posts/:slug/"

# 기존 blog 콘텐츠를 수정하지 않고 Chirpy의 글 타입에 연결한다.
[[cascade]]
  type = "post"
  [cascade.target]
    path = "/blog/**"
    kind = "page"

[taxonomies]
  category = "categories"
  tag = "tags"

[outputs]
  home = ["HTML", "RSS", "JSON"]

[markup]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.goldmark.parser]
    wrapStandAloneImageWithinParagraph = false
  [markup.goldmark.parser.attribute]
    block = true
    title = true
  [markup.highlight]
    noClasses = false
    guessSyntax = true
    lineNos = true
    lineNumbersInTable = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 4

# 콘텐츠는 한국어, UI 문구는 i18n/ko-KR.yml에서 영어로 표시한다.
[languages.ko]
  label = "한국어"
  locale = "ko-kr"
  contentDir = "content/korean"
  weight = 1

  [[languages.ko.menus.main]]
    name = "Home"
    url = "/"
    pre = "fa-house"
    weight = 1
  [[languages.ko.menus.main]]
    name = "About"
    url = "/about/"
    pre = "fa-circle-info"
    weight = 2
  [[languages.ko.menus.main]]
    name = "Blog"
    url = "/blog/"
    pre = "fa-archive"
    weight = 3
  [[languages.ko.menus.main]]
    name = "Categories"
    url = "/categories/"
    pre = "fa-folder-open"
    weight = 4
  [[languages.ko.menus.main]]
    name = "Tags"
    url = "/tags/"
    pre = "fa-tags"
    weight = 5

[languages.en]
  label = "English"
  locale = "en-us"
  contentDir = "content/english"
  weight = 2

[params]
  author = "grrru"
  description = "I’m a backend developer based in Korea."
  tagline = ""
  avatar = "/sae.jpg"
  mainSections = ["post"]
  toc = true

  [params.assets]
    self_host = false

  [params.social]
    name = "Namseok.Kim"
    url = "https://github.com/grrru"

  [[params.social.links]]
    type = "github"
    id = "grrru"
    icon = "fab fa-github"
  [[params.social.links]]
    type = "custom"
    id = "https://www.linkedin.com/in/grrru/"
    icon = "fab fa-linkedin"
  [[params.social.links]]
    type = "email"
    id = "gruns0989@naver.com"
    icon = "fas fa-envelope"
  [[params.social.links]]
    type = "rss"
    icon = "fas fa-rss"
    noblank = true

  [params.comments]
    enable = true
    provider = "giscus"
    [params.comments.giscus]
      repo = "grrru/grrru.github.io"
      repo_id = "R_kgDOR6925g"
      category = "Announcements"
      category_id = "DIC_kwDOR6925s4DGbiw"
      mapping = "pathname"
      strict = "1"
      reactions_enabled = "1"
      input_position = "top"
      lang = "ko"
