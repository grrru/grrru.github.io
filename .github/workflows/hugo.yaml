name: Build and deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:
  # grrru/blog-content 에 push 되면 호출됨
  repository_dispatch:
    types: [content-updated]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.160.0
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Checkout content
        uses: actions/checkout@v6
        with:
          repository: grrru/blog-content
          ssh-key: ${{ secrets.CONTENT_DEPLOY_KEY }}
          path: content
          fetch-depth: 0

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Install Hugo
        run: |
          curl -sLJO "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          mkdir "${HOME}/hugo"
          tar -C "${HOME}/hugo" -xf "hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          rm "hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          echo "${HOME}/hugo" >> "${GITHUB_PATH}"

      - name: Build
        run: |
          hugo \
            --gc \
            --minify \
            --baseURL "${{ steps.pages.outputs.base_url }}/" \
            --cacheDir "${{ runner.temp }}/hugo_cache"

      - name: Encrypt notes
        env:
          STATICRYPT_PASSWORD: ${{ secrets.NOTE_PASSWORD }}
        run: |
          [ -d public/note ] || exit 0
          if [ -z "${STATICRYPT_PASSWORD}" ]; then
            echo "::warning::NOTE_PASSWORD secret is not set; notes are not published."
            rm -rf public/note
            exit 0
          fi
          npx -y staticrypt@3.5.4 public/note -r -d public \
            --short \
            --remember 30 \
            -t staticrypt/password_template.html \
            --template-title "Note" \
            --template-instructions "비공개 노트입니다." \
            --template-placeholder "비밀번호" \
            --template-button "열기" \
            --template-remember "30일 동안 기억하기" \
            --template-error "비밀번호가 틀렸어요." \
            --template-color-primary "#222222" \
            --template-color-secondary "#f4f4f4"

      - name: Verify notes are encrypted
        run: |
          [ -d public/note ] || exit 0
          # 암호화 안 된 note HTML 이 하나라도 있으면 배포 중단
          leaked=$(find public/note -type f -name '*.html' -exec grep -L 'class="staticrypt-html"' {} + || true)
          if [ -n "${leaked}" ]; then
            echo "::error::Unencrypted note pages found:"
            echo "${leaked}"
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
