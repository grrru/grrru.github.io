name: Build and deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:
  # grrru/blog-content 에 push 되면 호출됨
  repository_dispatch:
    types: [content-updated]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.160.0
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Checkout content
        uses: actions/checkout@v6
        with:
          repository: grrru/blog-content
          ssh-key: ${{ secrets.CONTENT_DEPLOY_KEY }}
          path: content
          fetch-depth: 0

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Install Hugo
        run: |
          curl -sLJO "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          mkdir "${HOME}/hugo"
          tar -C "${HOME}/hugo" -xf "hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          rm "hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          echo "${HOME}/hugo" >> "${GITHUB_PATH}"

      # Hugoplate 테마와 모듈은 Hugo Modules(Go)로 받아온다
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      # Tailwind CSS (css.TailwindCSS 가 node_modules/.bin/tailwindcss 를 쓴다)
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: |
          node scripts/themeGenerator.js
          hugo \
            --gc \
            --minify \
            --baseURL "${{ steps.pages.outputs.base_url }}/" \
            --cacheDir "${{ runner.temp }}/hugo_cache"

      - name: Encrypt notes
        env:
          STATICRYPT_PASSWORD: ${{ secrets.NOTE_PASSWORD }}
        run: |
          [ -d public/note ] || exit 0
          if [ -z "${STATICRYPT_PASSWORD}" ]; then
            echo "::warning::NOTE_PASSWORD secret is not set; notes are not published."
            rm -rf public/note
            exit 0
          fi
          npx -y staticrypt@3.5.4 public/note -r -d public \
            --short \
            --remember 30 \
            -t staticrypt/password_template.html \
            --template-title "Note" \
            --template-instructions "Private notes." \
            --template-placeholder "Password" \
            --template-button "Unlock" \
            --template-remember "Remember me for 30 days" \
            --template-error "Wrong password." \
            --template-color-primary "#222222" \
            --template-color-secondary "#f4f4f4"

      - name: Verify notes are encrypted
        run: |
          # note 밖의 파일(sitemap, 검색 인덱스, RSS, 태그 등)이 note 를 가리키면 배포 중단
          refs=$(grep -rl '/note/' public --exclude-dir=note || true)
          if [ -n "${refs}" ]; then
            echo "::error::Files outside public/note reference /note/:"
            echo "${refs}"
            exit 1
          fi
          [ -d public/note ] || exit 0
          # 암호화 안 된 note HTML 이 하나라도 있으면 배포 중단
          leaked=$(find public/note -type f -name '*.html' -exec grep -L 'class="staticrypt-html"' {} + || true)
          if [ -n "${leaked}" ]; then
            echo "::error::Unencrypted note pages found:"
            echo "${leaked}"
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
